services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wb_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - AUTH_SERVICE_URL=http://auth:8080
      - COLLECTOR_SERVICE_URL=http://collector:8080
      - STOCK_SERVICE_URL=http://stock-analytics:8080
      - SALES_SERVICE_URL=http://sales-analytics:8080
      - COMPETITOR_SERVICE_URL=http://competitor:8080
      - SEO_SERVICE_URL=http://seo:8080
      - NOTIFICATION_SERVICE_URL=http://notifications:8080
      - FASHION_SERVICE_URL=http://fashion-analytics:8080
    depends_on:
      - auth
      - collector
      - stock-analytics
      - sales-analytics
      - competitor
      - seo
      - notifications
      - fashion-analytics

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/wb_analytics?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: collector
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - AUTH_SERVICE_URL=http://auth:8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/wb_analytics?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  stock-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stock-analytics
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - COLLECTOR_SERVICE_URL=http://collector:8080

  sales-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sales-analytics
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - COLLECTOR_SERVICE_URL=http://collector:8080

  competitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: competitor
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}

  seo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: seo
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/wb_analytics?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifications
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/wb_analytics?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  fashion-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: fashion-analytics
    environment:
      - HTTP_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - COLLECTOR_SERVICE_URL=http://collector:8080

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8080
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
